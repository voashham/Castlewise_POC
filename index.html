<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Application Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>Private Application Portal</h2>
        <p>Select an application to access</p>
    </header>

    <section class="toolbar">
        <label for="appSelector">Select Application:</label>

        <select id="appSelector">
            <option value="">Choose an application</option>
            <option value="app1">Application 1</option>
            <option value="app2">Application 2</option>
            <option value="app3">Application 3</option>
        </select>
    </section>

    <main>
        <iframe
            id="appFrame"
            title="Selected application"
            src="about:blank">
        </iframe>
    </main>

    <script src="script.js"></script>

</body>
</html>
