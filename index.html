<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlewise Private App Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        h1 { color: #111827; font-size: 24px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-launch {
            background-color: #0078d4;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }
        .btn-launch:hover { background-color: #005a9e; }
        .btn-launch:disabled { background-color: #a1a1aa; cursor: not-allowed; }
        .btn-secondary {
            background-color: #4b5563;
        }
        .btn-secondary:hover { background-color: #374151; }
        
        #output {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 14px;
            text-align: left;
            word-break: break-word;
            max-height: 250px;
            overflow-y: auto;
        }
        .success { border-left: 4px solid #107c41; }
        .error { border-left: 4px solid #d13438; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Castlewise App Service</h1>
        <p>Click below to test or access the app service via your SWA proxy link.</p>
        
        <div class="btn-container">
            <!-- Option 1: Fetch and display response inside this page -->
            <button id="launchBtn" class="btn-launch" onclick="fetchData()">Fetch App Data</button>
            
            <!-- Option 2: Navigate directly via the SWA proxy route -->
            <a href="/api" target="_blank" class="btn-launch btn-secondary">Open App Service</a>
        </div>

        <div id="output" style="display: none;"></div>
    </div>

    <script>
        async function fetchData() {
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('launchBtn');

            outputDiv.style.display = 'block';
            outputDiv.className = '';
            outputDiv.innerText = 'Connecting to App Service via SWA proxy...';
            btn.disabled = true;

            try {
                // Calls the proxy endpoint configured via Backend Link in Azure Portal
                const res = await fetch('/api');
                
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                
                const contentType = res.headers.get("content-type");
                
                if (contentType && contentType.includes("application/json")) {
                    const data = await res.json();
                    outputDiv.innerText = JSON.stringify(data, null, 2);
                } else {
                    const text = await res.text();
                    outputDiv.innerText = text || "Successfully connected! (Empty response body returned)";
                }
                
                outputDiv.classList.add('success');
            } catch (err) {
                outputDiv.innerText = `Connection Error:\n${err.message}`;
                outputDiv.classList.add('error');
            } finally {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
