<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlewise App Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #111827; font-size: 24px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .btn-launch {
            display: inline-block;
            background-color: #0078d4;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-launch:hover { background-color: #005a9e; }
        #output {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            text-align: left;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Castlewise App Service</h1>
        <p>Click below to fetch the App Service.</p>
        
        <button class="btn-launch" onclick="fetchMvcApp()">Access App Service</button>
        <div id="output" style="display: none;"></div>
    </div>

    <script>
        async function fetchMvcApp() {
            const out = document.getElementById('output');
            out.style.display = 'block';
            out.innerText = 'Connecting via proxy...';

            try {
                // SWA proxies calls to /api directly to the linked App Service
                const res = await fetch('/api/Home/Index');
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                
                const html = await res.text();
                out.innerHTML = html; // Renders the MVC view content directly inside the card
            } catch (err) {
                out.innerText = `Error: ${err.message}`;
            }
        }
    </script>

</body>
</html>
