<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Castlewise Private App Launcher</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }
        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #111827; font-size: 24px; margin-bottom: 8px; }
        p { color: #6b7280; font-size: 14px; margin-bottom: 24px; }
        .btn-launch {
            display: inline-block;
            background-color: #0078d4;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-launch:hover { background-color: #005a9e; }
        .btn-launch:disabled { background-color: #a1a1aa; cursor: not-allowed; }
        #output {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            color: #1f2937;
            font-size: 14px;
            text-align: left;
            word-break: break-word;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Castlewise App Service</h1>
        <p>Click below to open the app service in your VNet environment.</p>
        
        <button id="launchBtn" class="btn-launch" onclick="fetchData()">Access App Service</button>
        <div id="output" style="display: none;"></div>
    </div>

    <script>
        async function fetchData() {
            const outputDiv = document.getElementById('output');
            const btn = document.getElementById('launchBtn');

            outputDiv.style.display = 'block';
            outputDiv.innerText = 'Fetching data from App Service...';
            btn.disabled = true;

            try {
                // Calls the proxy endpoint configured via Backend Link
                const res = await fetch('/api');
                
                if (!res.ok) {
                    throw new Error(`Status ${res.status}: ${res.statusText}`);
                }
                
                const data = await res.text();
                outputDiv.innerText = data;
            } catch (err) {
                outputDiv.innerText = `Error: ${err.message}`;
            } finally {
                btn.disabled = false;
            }
        }
    </script>

</body>
</html>
